# Skill Dependencies - Aether.go V3.0 Consolidated
# Generated: 2026-06-02
# Total: 25 skills (16 merged + 9 standalone)
# Coverage: P0-P14 (15 principles), L1-L5+4.5 (6 layers), 3 modes, 10 scenarios

version: "3.0"
methodology_alignment:
  principles: "P0-P14 (15 constitutional principles)"
  derivation_layers: "L1-L5 + L4.5 (six-layer derivation)"
  modes: ["standard", "poc", "emergency"]
  scenarios: ["ai-native-build", "harness-reverse-construction", "traditional-waterfall", "greenfield", "brownfield", "wartime", "federated", "parallel", "poc-validation", "migration"]

# ============================================================================
# GROUP A: DERIVATION CHAIN (6 skills)
# Linear pipeline: L1 → L2 → L3 → L4 → L4.5 → L5
# ============================================================================

A_derivation_chain:
  - name: requirement-analyzer
    type: merged
    role: L1
    description: "Collect, classify (13 categories per ISO/IEC 25010:2023), decompose business goals into measurable functional requirements"
    merges:
      - business-requirements-collector
      - business-value-mapper
      - requirement-classifier
      - value-decomposer
      - metrics-definer
      - requirements-to-code-docs
    outputs: ["L1 functional_requirements", "L1 NFRs", "L1 metrics"]
    principles_aligned: ["P0", "P1", "P3", "P7", "P14"]
    dependencies: []
    next: ["architecture-planner"]

  - name: architecture-planner
    type: merged
    role: L2
    description: "Select architecture patterns, tech stack, design data flow, define interface contracts (P4)"
    merges:
      - architecture-decision-recorder
      - architecture-pattern-selector
      - tech-stack-selector
      - data-flow-analyzer
      - interface-contract-designer
      - strangler-pattern-suite
    outputs: ["L2 architecture_decision_records", "L2 interface_contracts", "L2 tech_stack"]
    principles_aligned: ["P2", "P4", "P6"]
    dependencies: ["requirement-analyzer"]
    next: ["spec-engineer"]

  - name: spec-engineer
    type: merged
    role: L3
    description: "Parse specs, design use cases, write BDD/ATDD scenarios (GWT), classify NFRs, manage version history"
    merges:
      - spec-parser
      - usecase-designer
      - bdd-scenario-writer
      - atdd-acceptance-test-generator
      - spec-to-scenario
      - scenario-completeness-checker
      - nfr-analyzer
      - spec-version-manager
    outputs: ["L3 use_cases", "L3 GWT_scenarios", "L3 NFRs_validated", "L3 spec_versions"]
    principles_aligned: ["P0", "P1", "P4", "P7"]
    dependencies: ["architecture-planner"]
    next: ["test-planner"]

  - name: test-planner
    type: merged
    role: L4
    description: "Derive test pyramid stratification (unit/integration/contract/system/e2e/non-functional) from GWT acceptance criteria"
    merges:
      - test-pyramid-deriver
      - test-pyramid-validator
      - e2e-test-generator
      - integration-test-generator
      - contract-test-generator
      - system-test-generator
      - unit-test-generator
      - sit-scenario-generator
      - chaos-test-designer
    outputs: ["L4 test_pyramid", "L4 test_specifications", "L4 contract_tests"]
    principles_aligned: ["P8", "P9", "P11"]
    dependencies: ["spec-engineer"]
    next: ["generation-dispatcher"]

  - name: generation-dispatcher
    type: merged
    role: L4.5
    description: "Determine what to generate deterministically (based on confidence) vs. what to leave for humans; enforce contract consistency gate"
    merges:
      - deterministic-evaluator
      - code-generator-dispatcher
      - contract-consistency-gate
      - confidence-based-reviewer
    outputs: ["L4.5 generation_plan", "L4.5 confidence_scores", "L4.5 contract_violations"]
    principles_aligned: ["P4", "P9", "P11", "P12"]
    dependencies: ["test-planner"]
    next: ["code-generator"]

  - name: code-generator
    type: merged
    role: L5
    description: "Generate code from interface contracts (frontend + backend + language-agnostic)"
    merges:
      - contract-driven-code-generator
      - backend-code-generator
      - frontend-code-generator
      - generic-code-generator
    outputs: ["L5 implementation_code", "L5 generated_tests"]
    principles_aligned: ["P4", "P9", "P11"]
    dependencies: ["generation-dispatcher"]
    next: []

# ============================================================================
# GROUP B: PROJECT SUPPORT (3 skills)
# Cross-cutting concerns used throughout the pipeline
# ============================================================================

B_project_support:
  - name: go-fullstack-scaffolder
    type: merged
    role: scaffolding
    description: "Generate Go + Vue + Quasar fullstack project with Makefile, README, LICENSE; production-ready"
    merges:
      - go-backend-scaffolder
      - go-cli-builder
      - vue-quasar-scaffolder
      - fullstack-project-setup
      - go-vue-fullstack-workflow
      - makefile-backend-generator
      - readme-license-generator
    outputs: ["project_skeleton", "Makefile", "README_CN_EN", "LICENSE"]
    principles_aligned: ["P0", "P1", "P6"]
    dependencies: []
    next: ["architecture-planner", "code-generator"]

  - name: constitution-validator
    type: merged
    role: cross_cutting
    description: "Validate code/specs against P0-P14 constitutional principles; resolve principle conflicts via dynamic weighting"
    merges:
      - constitution-validator
      - principle-consistency-checker
      - constraint-check-runner
    outputs: ["principle_compliance_report", "principle_conflict_resolution"]
    principles_aligned: ["P0", "P1", "P2", "P3", "P4", "P5", "P6", "P7", "P8", "P9", "P10", "P11", "P12", "P13", "P14"]
    dependencies: []
    next: []

  - name: context-manager
    type: standalone
    role: cross_cutting
    description: "Manage project context, conversation history, derivation matrix (P7 Context-First Principle)"
    outputs: ["context_state", "derivation_matrix", "session_history"]
    principles_aligned: ["P7"]
    dependencies: []
    next: []

# ============================================================================
# GROUP C: SCENARIO ADAPTATION (3 skills)
# Select and adapt workflow based on project scenario
# ============================================================================

C_scenario_adaptation:
  - name: scenario-engine
    type: merged
    role: scenario_dispatch
    description: "Detect scenario (greenfield/brownfield/AI-native/etc.), recommend mode (standard/POC/wartime), support federal and dual-track modes"
    merges:
      - scenario-detector
      - scenario-mode-recommender
      - mode-selector
      - poc-exemption-manager
      - dual-track-validator
      - ai-native-build-workflow
      - standard-mode-workflow
      - federal-constitution-manager
      - harness-reverse-construction-workflow
    outputs: ["detected_scenario", "recommended_mode", "derivation_parameters", "federal_constitution_map"]
    principles_aligned: ["P0", "P6", "P14"]
    dependencies: ["context-manager"]
    next: ["requirement-analyzer", "reverse-engineering-suite", "wartime-hotfix-workflow"]

  - name: reverse-engineering-suite
    type: standalone
    role: scenario_specialized
    description: "Extract specs from legacy systems via static + dynamic analysis; generate characterization tests"
    outputs: ["L1_extracted_specs", "characterization_tests", "migration_plan"]
    principles_aligned: ["P0", "P9", "P13"]
    dependencies: ["scenario-engine"]
    next: ["requirement-analyzer", "test-planner"]

  - name: wartime-hotfix-workflow
    type: standalone
    role: scenario_specialized
    description: "Two-phase emergency response (immediate + 24h normalization); battle rhythm; skill library update"
    outputs: ["incident_resolution", "retroactive_spec", "skill_library_update"]
    principles_aligned: ["P0", "P9", "P12", "P14"]
    dependencies: ["scenario-engine"]
    next: ["incident-manager", "requirement-analyzer", "test-planner", "skill-manager"]

# ============================================================================
# GROUP D: OPERATIONS (2 skills)
# Production runtime concerns
# ============================================================================

D_operations:
  - name: deployment-orchestrator
    type: merged
    role: operations
    description: "Multi-environment deployment (blue-green/canary/rolling) + rollback + release coordination + change management"
    merges:
      - deployment-orchestrator
      - rollback-manager
      - release-manager
      - change-management
    outputs: ["deployment_plan", "rollback_procedure", "release_notes", "change_record"]
    principles_aligned: ["P0", "P9", "P11"]
    dependencies: ["code-generator", "constitution-validator"]
    next: []

  - name: incident-manager
    type: standalone
    role: operations
    description: "Full ITIL incident + problem management lifecycle (used for all incidents; wartime-hotfix-workflow for emergencies)"
    outputs: ["incident_record", "rca_report", "permanent_fix_plan"]
    principles_aligned: ["P0", "P9", "P14"]
    dependencies: ["deployment-orchestrator"]
    next: ["skill-manager", "recursive-optimizer"]

# ============================================================================
# GROUP E: EVOLUTION (3 skills)
# Continuous improvement and self-optimization
# ============================================================================

E_evolution:
  - name: recursive-optimizer
    type: standalone
    role: meta_capability
    description: "Recursive self-optimization of skills, prompts, workflows based on execution results and feedback"
    outputs: ["optimization_recommendations", "convergence_status", "defect_fixes"]
    principles_aligned: ["P9", "P11", "P14"]
    dependencies: ["metrics-tracker", "architecture-auditor"]
    next: ["skill-manager"]

  - name: skill-manager
    type: standalone
    role: meta_capability
    description: "Manage skill library lifecycle: creation, validation, assetization, application, feedback, optimization, retirement"
    outputs: ["skill_lifecycle_records", "skill_quality_metrics", "skill_recommendations"]
    principles_aligned: ["P14"]
    dependencies: ["recursive-optimizer"]
    next: []

  - name: metrics-tracker
    type: standalone
    role: meta_capability
    description: "Track AI effectiveness (token/cost/quality) and system quality (defect rates/perf/reliability)"
    outputs: ["ai_metrics", "system_metrics", "dashboard_data"]
    principles_aligned: ["P11", "P14"]
    dependencies: []
    next: ["recursive-optimizer"]

# ============================================================================
# GROUP F: META (2 skills)
# Cross-domain auditing and validation
# ============================================================================

F_meta:
  - name: architecture-auditor
    type: merged
    role: meta_capability
    description: "Audit overall architecture for completeness, consistency, derivation chain integrity (L1-L5); propose adjustments"
    merges:
      - architecture-self-auditor
      - derivation-chain-validator
      - adjustment-proposer
      - adjustment-validator
    outputs: ["architecture_audit_report", "derivation_gaps", "adjustment_proposals"]
    principles_aligned: ["P0", "P4", "P11", "P14"]
    dependencies: ["constitution-validator", "universal-skeptic"]
    next: ["recursive-optimizer"]

  - name: universal-skeptic
    type: merged
    role: meta_capability
    description: "Cross-domain validation: correctness, completeness, consistency, boundedness (skeptic skill layer)"
    merges:
      - correctness-checker
      - completeness-checker
      - consistency-checker
      - boundedness-checker
    outputs: ["validation_report", "defect_list", "rationale_challenge"]
    principles_aligned: ["P0", "P4", "P11", "P14"]
    dependencies: []
    next: ["architecture-auditor"]

# ============================================================================
# GROUP G: STANDALONE (5 skills)
# Independent core capabilities
# ============================================================================

G_standalone:
  - name: intent-hierarchizer
    type: standalone
    role: pre_derivation
    description: "Hierarchize user intent into Goal → Sub-Goal → Task → Sub-Task; prevent perfect derivation but wrong software"
    outputs: ["intent_hierarchy", "task_decomposition"]
    principles_aligned: ["P0", "P12"]
    dependencies: []
    next: ["scenario-engine", "requirement-analyzer"]

  - name: methodology-fusion-orchestrator
    type: standalone
    role: meta_capability
    description: "Orchestrate end-to-end Aether methodology fusion across all eight lifecycle stages"
    outputs: ["orchestration_plan", "stage_transitions", "methodology_adherence_report"]
    principles_aligned: ["P0", "P1", "P7", "P14"]
    dependencies: ["context-manager", "scenario-engine"]
    next: []

  - name: tdd-cycle-runner
    type: standalone
    role: implementation
    description: "Execute complete TDD red-green-refactor cycle as atomic skill, bridging L4 tests to L5 implementation"
    outputs: ["failing_tests", "passing_tests", "refactored_code"]
    principles_aligned: ["P9"]
    dependencies: ["test-planner", "code-generator"]
    next: []

  - name: code-refactor-engine
    type: standalone
    role: implementation
    description: "Refactor code to improve design while maintaining test coverage; supports P9 recursive optimization"
    outputs: ["refactored_code", "behavior_preservation_evidence"]
    principles_aligned: ["P9", "P11", "P14"]
    dependencies: ["tdd-cycle-runner"]
    next: []

  - name: meta-skeptic
    type: standalone
    role: meta_capability
    description: "Challenge boundary rationality of test-pyramid-deriver and similar outputs with META-005 protocol"
    outputs: ["rationale_challenge", "boundary_violations"]
    principles_aligned: ["P0", "P4", "P11"]
    dependencies: ["universal-skeptic", "test-planner"]
    next: []

  - name: semantic-intent-clarifier
    type: standalone
    role: pre_derivation
    description: "Generate structured reverse clarification questions at critical requirement semantic nodes"
    outputs: ["clarification_questions", "intent_disambiguation"]
    principles_aligned: ["P0", "P12"]
    dependencies: []
    next: ["intent-hierarchizer", "requirement-analyzer"]

# ============================================================================
# DERIVATION PIPELINE (Standard Mode)
# ============================================================================

derivation_pipeline_standard:
  - step: 0
    stage: "Pre-derivation"
    skills: ["intent-hierarchizer", "semantic-intent-clarifier", "context-manager"]
  - step: 1
    stage: "Scenario detection"
    skills: ["scenario-engine"]
  - step: 2
    stage: "L1 Requirements"
    skills: ["requirement-analyzer"]
  - step: 3
    stage: "L2 Architecture"
    skills: ["architecture-planner", "go-fullstack-scaffolder"]
  - step: 4
    stage: "L3 Specifications"
    skills: ["spec-engineer"]
  - step: 5
    stage: "L4 Tests"
    skills: ["test-planner"]
  - step: 6
    stage: "L4.5 Dispatch"
    skills: ["generation-dispatcher"]
  - step: 7
    stage: "L5 Code"
    skills: ["code-generator", "tdd-cycle-runner", "code-refactor-engine"]
  - step: 8
    stage: "Validation"
    skills: ["constitution-validator", "architecture-auditor", "universal-skeptic", "meta-skeptic"]
  - step: 9
    stage: "Deployment"
    skills: ["deployment-orchestrator"]
  - step: 10
    stage: "Operations"
    skills: ["incident-manager", "wartime-hotfix-workflow"]
  - step: 11
    stage: "Evolution"
    skills: ["metrics-tracker", "recursive-optimizer", "skill-manager"]

